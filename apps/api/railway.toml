[build]
builder = "NIXPACKS"
# Always generate Prisma client after install.
buildCommand = "npm ci || npm install; npx prisma generate"

[deploy]
# Migrate + start in one process (more reliable than preDeploy stop/start).
startCommand = "npx prisma migrate deploy && node src/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
