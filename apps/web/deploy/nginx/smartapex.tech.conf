# APEX Workspace — Nginx site for Hostinger KVM 2
# Domain example: smartapex.tech  (replace if your domain differs)
#
# Install on VPS:
#   sudo cp apps/web/deploy/nginx/smartapex.tech.conf /etc/nginx/sites-available/smartapex.tech
#   sudo ln -sf /etc/nginx/sites-available/smartapex.tech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL: after DNS A record points to the VPS IP, run:
#   sudo certbot --nginx -d smartapex.tech -d www.smartapex.tech

upstream apex_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream apex_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Redirect HTTP → HTTPS (Certbot usually manages this; keep as fallback)
server {
    listen 80;
    listen [::]:80;
    server_name smartapex.tech www.smartapex.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartapex.tech www.smartapex.tech;

    # Certbot will replace / fill these paths on first run:
    # ssl_certificate     /etc/letsencrypt/live/smartapex.tech/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/smartapex.tech/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Temporary self-signed placeholders so nginx -t works before certbot.
    # Remove these two lines after certbot succeeds.
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    client_max_body_size 512M;

    # Security headers (app also sets some; these are belt-and-suspenders)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- API / health / files / realtime ---
    location /health {
        proxy_pass http://apex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Video/audio media streams (Range / 206) — disable buffering so nginx
    # does not hold the whole file before the browser can start playback.
    location ~ ^/api/v1/(files/media/|files/raw/|public/portfolio/[^/]+/stream|portfolio/[^/]+/stream) {
        proxy_pass http://apex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    location /api/ {
        proxy_pass http://apex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    location /files/ {
        proxy_pass http://apex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1200s;
    }

    location /socket.io/ {
        proxy_pass http://apex_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # --- Next.js frontend (NOT static export — needs Node) ---
    location / {
        proxy_pass http://apex_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
